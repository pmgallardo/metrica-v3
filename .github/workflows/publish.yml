on:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Instalar Quarto y TinyTex
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          # Trata de evitar error 403 Forbidden por tráfico anónimo
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Instala TinyTeX de forma autenticada
          tinytex: true

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}