project:
  type: book
  output-dir: _book

lang: es-ES
date: "31/01/2000"
date-modified: today
date-format: "DD/MM/YYYY"

book:
  title: "Métrica v.3"
  author: "Ministerio de Administraciones Públicas"
  favicon: images/favicon32.png
    
  site-url: https://pmgallardo.github.io/metrica-v3/
  repo-url: https://github.com/pmgallardo/metrica-v3
  repo-actions: [edit, issue, source]
  output-file: "metrica-v3"
  downloads: [pdf, epub]
  
  sidebar:
    style: "docked"
    search: true
    
  chapters:
    - index.qmd
    - part: "Estructura principal"
      chapters:
      - 01-principal/01-introduccion.qmd
      - 01-principal/02-psi.qmd
      - 01-principal/03-evs.qmd
      - 01-principal/04-asi.qmd
      - 01-principal/05-dsi.qmd
      - 01-principal/06-csi.qmd
      - 01-principal/07-ias.qmd
      - 01-principal/08-msi.qmd
    - part: "Interfaces"
      chapters:
      - 02-interfaces/01-cal.qmd
      - 02-interfaces/02-seg.qmd
      - 02-interfaces/03-gc.qmd
      - 02-interfaces/04-gp.qmd
    - part: "Técnicas"
      chapters:
      - 03-tecnicas/01-tecnicas.qmd
    - part: "Participantes"
      chapters:
      - 04-participantes/01-participantes.qmd

format: 
  html:
    theme: minimal
    css: styles.css
    toc: true
    toc-depth: 4
    number-sections: true
    include-in-header:
      # Reconocimiento de propiedad para Google Search Console
      text: |
        <meta name="google-site-verification" content="IPR74Q6s90zKZxczgop7rsjY6tQAvbAdHctA9P1ieeM" />
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex
    mainfont: "Source Sans 3"
    sansfont: "Source Sans 3"
    monofont: "Source Code Pro"
    fontsize: 11pt
    linestretch: 1.15
    papersize: a4
    geometry:
      - top=25mm
      - bottom=25mm
      - left=27mm
      - right=25mm
    toc: true
    toc-depth: 4
    number-sections: true
    colorlinks: true
    linkcolor: agebluelink
    urlcolor: agebluelink
    citecolor: agebluelink
    toccolor: agebluelink
    code-block-bg: "#f7f9fc"
    code-block-border-left: "#003399"
    include-in-header:
      - latex/preamble.tex
  epub:
    toc: true
    toc-depth: 4
    number-sections: true
